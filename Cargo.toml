[package]
name = "lyfta-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local MCP server for the official Lyfta personal API"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
dotenvy = "0.15"
jsonschema = { version = "0.37", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
